name: Bug Report
description: Report a reproducible bug in Control Center
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Deploy Control Center with ...
        2. Add / inspect unit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What you expected to happen and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Docker (GHCR / Compose)
        - Prebuilt Release Binary
        - Source Checkout (Bun)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit & Target OS
      description: Control Center release tag or commit SHA, host OS, and managed unit Linux distro.
      placeholder: "v0.2.0, Debian 13, Ubuntu 24.04 unit"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste sanitized server or agent logs (remove keys, passwords, hostnames, IPs, and MAC addresses).
      render: text
