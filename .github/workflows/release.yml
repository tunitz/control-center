name: Release & Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also tag pushed main image as latest
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: release-please
    if: ${{ always() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tunitz/control-center
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.release_created == 'true' || inputs.publish_latest == true }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies and build web bundle
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Build cross-platform Bun executables
        run: |
          mkdir -p release-artifacts
          for pair in \
            "linux-x64:bun-linux-x64:control-center" \
            "darwin-arm64:bun-darwin-arm64:control-center" \
            "windows-x64:bun-windows-x64:control-center.exe"; do
            os_arch="${pair%%:*}"
            rest="${pair#*:}"
            bun_target="${rest%%:*}"
            bin_name="${rest#*:}"

            stage="stage-${os_arch}"
            rm -rf "${stage}"
            mkdir -p "${stage}/apps/web"
            bun build --compile --target="${bun_target}" --no-compile-autoload-dotenv --external cpu-features \
              apps/server/src/index.ts --outfile "${stage}/${bin_name}"
            cp -R apps/web/dist "${stage}/apps/web/dist"
            cp -R agent "${stage}/agent"
            cp .env.example "${stage}/.env.example"

            if [ "${os_arch}" = "windows-x64" ]; then
              (cd "${stage}" && zip -r "../release-artifacts/control-center-${TAG}-${os_arch}.zip" .)
            else
              tar -C "${stage}" -czf "release-artifacts/control-center-${TAG}-${os_arch}.tar.gz" .
            fi
          done
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Upload release assets
        run: gh release upload "${TAG}" release-artifacts/* --clobber
