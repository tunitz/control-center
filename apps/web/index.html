<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="text-scale" content="scale">
<meta id="theme-color" name="theme-color" content="#f5f6f8">
<script>try{var t=localStorage.getItem('cc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.getElementById('theme-color').content=d?'#0d0e11':'#f5f6f8'}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Control Center">
