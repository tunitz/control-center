# network_mode: host so Wake-on-LAN broadcasts reach the LAN and units are reachable by IP.
services:
  control-center:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: "3030"
      CC_MASTER_KEY: ${CC_MASTER_KEY:?set CC_MASTER_KEY in .env}
      CC_ADMIN_PASSWORD: ${CC_ADMIN_PASSWORD:-}
      CC_PUBLIC_URL: ${CC_PUBLIC_URL:?e.g. http://192.168.31.206:3030 (must be reachable from the units)}
    volumes:
      - cc-data:/data
volumes:
  cc-data:
