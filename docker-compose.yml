# network_mode: host so Wake-on-LAN broadcasts reach the LAN and units are reachable by IP.
services:
  control-center:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: "3030"
      CC_MASTER_KEY: ${CC_MASTER_KEY:?set CC_MASTER_KEY in .env}
      CC_ADMIN_PASSWORD: ${CC_ADMIN_PASSWORD:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      # Pi chat backend: the pi-bridge systemd user service on this host (127.0.0.1:3050). Empty token = Pi chats off.
      PI_BRIDGE_TOKEN: ${PI_BRIDGE_TOKEN:-}
      PI_BRIDGE_URL: ${PI_BRIDGE_URL:-http://127.0.0.1:3050}
      CHAT_UPLOAD_DIR: /home/tunitz/.hermes/cache/chat-uploads
    volumes:
      - cc-data:/data
      - /home/tunitz/.hermes/cache/chat-uploads:/home/tunitz/.hermes/cache/chat-uploads
    # HERMES_API_KEY, PI_BRIDGE_TOKEN and CHAT_UPLOAD_DIR are passed through; never printed or logged.
volumes:
  cc-data:
